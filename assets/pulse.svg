<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="150">
  <defs>
    <!-- Grid pattern for the Quant/Data theme -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" stroke-dasharray="2,2"/>
    </pattern>

    <!-- Glowing gradient transitioning from cold blue (Data) to warm amber/red (Life) -->
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090b" stop-opacity="0" />
      <stop offset="15%" stop-color="#3b82f6" stop-opacity="1" /> <!-- Cold Quant -->
      <stop offset="40%" stop-color="#10b981" stop-opacity="1" /> <!-- Bio Green -->
      <stop offset="60%" stop-color="#ef4444" stop-opacity="1" /> <!-- EKG Heartbeat -->
      <stop offset="85%" stop-color="#f59e0b" stop-opacity="1" /> <!-- Warmth -->
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </linearGradient>

    <!-- Blur filter for neon glow -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <style>
    .pulse-glow {
      fill: none;
      stroke: url(#glow);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.5;
      filter: url(#blur);
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .pulse-path {
      fill: none;
      stroke: url(#glow);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .grid-bg {
      fill: url(#grid);
    }
    @keyframes dash {
      0% { stroke-dashoffset: 1000; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }
    .text-label {
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      fill: #4b5563;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="150" class="grid-bg" />

  <!-- Technical Annotations -->
  <text x="20" y="20" class="text-label">[ PHASE 1: QUANT &amp; DATA_STREAM ]</text>
  <text x="360" y="20" class="text-label">[ PHASE 2: BIOLOGICAL_PULSE ]</text>
  <text x="650" y="20" class="text-label">[ PHASE 3: AGENTIC_SYNC ]</text>

  <!-- The Metaphorical Path: Quant/Volatility -> EKG Pulse -> DNA/Sine Wave -->
  <g>
    <!-- Static ghost line -->
    <path pathLength="1000" d="M -10 100 L 50 110 L 90 80 L 130 100 L 170 120 L 210 90 L 260 105 L 320 105 L 360 105 L 380 50 L 395 140 L 410 70 L 430 105 L 480 105 L 530 105 Q 580 60, 630 105 T 730 105 L 810 105" fill="none" stroke="#27272a" stroke-width="1" />
    
    <!-- Animated Glow -->
    <path pathLength="1000" d="M -10 100 L 50 110 L 90 80 L 130 100 L 170 120 L 210 90 L 260 105 L 320 105 L 360 105 L 380 50 L 395 140 L 410 70 L 430 105 L 480 105 L 530 105 Q 580 60, 630 105 T 730 105 L 810 105" class="pulse-glow" />
    
    <!-- Animated Core -->
    <path pathLength="1000" d="M -10 100 L 50 110 L 90 80 L 130 100 L 170 120 L 210 90 L 260 105 L 320 105 L 360 105 L 380 50 L 395 140 L 410 70 L 430 105 L 480 105 L 530 105 Q 580 60, 630 105 T 730 105 L 810 105" class="pulse-path" />
  </g>
</svg>
